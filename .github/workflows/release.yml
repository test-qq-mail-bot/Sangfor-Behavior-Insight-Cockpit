name: Release cus_insight

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cus_insight-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f version.js ]; then
            echo "::error::version.js not found at repository root"
            exit 1
          fi

          VERSION="$(jq -r '.version // empty' version.js)"
          if [ -z "${VERSION}" ]; then
            echo "::error::version.js does not contain a version field"
            exit 1
          fi
          if ! [[ "${VERSION}" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "::error::invalid version: ${VERSION}"
            exit 1
          fi

          APP_ID="cus_insight"
          if ! [[ "${APP_ID}" =~ ^cus_[a-z]{3,28}$ ]]; then
            echo "::error::invalid app id: ${APP_ID}"
            exit 1
          fi
          TAG="v${VERSION}"
          TITLE="${APP_ID} v${VERSION}"
          ASSET="${APP_ID}.zip"

          rm -rf build
          mkdir -p "build/${APP_ID}" dist
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='build' \
            --exclude='dist' \
            --exclude='*.zip' \
            --exclude='.DS_Store' \
            ./ "build/${APP_ID}/"

          rm -f "dist/${ASSET}"
          (cd build && zip -qr "../dist/${ASSET}" "${APP_ID}")
          test -f "dist/${ASSET}"
          unzip -l "dist/${ASSET}" | sed -n '1,12p'

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TRIGGER="manual"
          else
            TRIGGER="push"
          fi

          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          {
            echo "## ${TITLE}"
            echo
            echo "### 更新记录"
            jq -r '.update_log[]? | "- " + .' config/package.chs.js || echo "- 无更新记录"
            echo
            echo "- 版本号：\`${VERSION}\`"
            echo "- 提交：\`${GITHUB_SHA}\`"
            echo "- 分支：\`${GITHUB_REF_NAME}\`"
            echo "- 触发方式：${TRIGGER}"
            echo "- 构建时间：$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          } > "${NOTES_FILE}"

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG_EXISTS=true
          else
            TAG_EXISTS=false
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists, updating asset and notes."
            while IFS= read -r stale; do
              if [ -n "${stale}" ] && [ "${stale}" != "${ASSET}" ]; then
                echo "Removing stale asset: ${stale}"
                gh release delete-asset "${TAG}" "${stale}" --yes
              fi
            done < <(gh release view "${TAG}" --json assets -q '.assets[].name')
            gh release upload "${TAG}" "dist/${ASSET}" --clobber
            gh release edit "${TAG}" --title "${TITLE}" --notes-file "${NOTES_FILE}"
          else
            echo "Creating release ${TAG}."
            if [ "${TAG_EXISTS}" = "true" ]; then
              gh release create "${TAG}" "dist/${ASSET}" \
                --title "${TITLE}" \
                --notes-file "${NOTES_FILE}"
            else
              gh release create "${TAG}" "dist/${ASSET}" \
                --target "${GITHUB_SHA}" \
                --title "${TITLE}" \
                --notes-file "${NOTES_FILE}"
            fi
          fi

          RELEASE_URL="$(gh release view "${TAG}" --json url -q .url)"
          {
            echo "### Release published"
            echo
            echo "- 版本：\`${VERSION}\`"
            echo "- 资产：\`${ASSET}\`"
            echo "- 下载：${RELEASE_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"
